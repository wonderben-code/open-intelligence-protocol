name: CI

# Every gate of BUILD.md, Section 2, that applies to the code in the
# repository so far. The "checks" job runs `pnpm run ci` (scripts/ci.ts), the
# same script a contributor runs before pushing, so the two cannot drift
# apart. Actions are pinned by commit SHA; Dependabot keeps the pins current.

on:
  push:
    paths-ignore:
      - "timestamps/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push and a pull request for the same commit each keep their own run:
  # a skipped job must never stand in for a failed one on a required check.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push replaces a run still in progress, except on main, where
  # every commit keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The differential tests fail, rather than skip, if Python is missing.
  OIP_REQUIRE_PYTHON: "1"

jobs:
  checks:
    name: Every check (pnpm run ci)
    runs-on: ubuntu-latest
    # The checks take about five minutes, and the 10,000 identity logs compared
    # with the Python checker about as long again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the Python checker's dependency and the REUSE tool, by hash
        run: |
          python -m pip install --require-hashes -r .github/requirements/vector-checker.txt
          python -m pip install --require-hashes -r .github/requirements/reuse.txt
      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Every check, in order
        run: pnpm run ci

  containers:
    name: The service images pass the conformance suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build the images and start the three services (ADR-0014)
        run: docker compose up --build --wait --wait-timeout 120
      - name: Each service runs as a user that is not root, on a read-only file system
        run: |
          for service in resolver host indexer; do
            id="$(docker compose ps --quiet "$service")"
            test "$(docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}}' "$id")" = "65532:65532 true"
          done
      # A signed request and a Hello name the origin a service knows itself by (Layer 1, 13.3).
      - name: The Resolver profile
        run: node --conditions=@oip/source packages/conformance/src/bin.ts resolver http://127.0.0.1:8081 --origin https://resolver.localhost
      - name: The Host profile
        run: node --conditions=@oip/source packages/conformance/src/bin.ts host http://127.0.0.1:8082 --origin https://host.localhost
      # What an indexer forwards is checked where the suite has an inbox to watch, which the
      # tests of @oip/conformance give it. Here those checks are skipped, and nothing may fail.
      - name: The Indexer profile
        run: node --conditions=@oip/source packages/conformance/src/bin.ts indexer http://127.0.0.1:8083 --origin https://indexer.localhost --allow-skipped
      # BUILD.md 3.8: a server container starts within two seconds (ADR-0015).
      - name: Each service is ready within two seconds of its start
        run: node scripts/container-start.ts
      - name: What the services logged, if a step failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the services
        if: always()
        run: docker compose down --volumes

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the Python checker's dependency, by hash
        run: python -m pip install --require-hashes -r .github/requirements/vector-checker.txt
      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Tests, with coverage thresholds
        run: pnpm test:coverage
      - name: Golden vectors, by case kind
        run: pnpm test:vectors

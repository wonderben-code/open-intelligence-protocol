name: Mutation testing

# BUILD.md, Section 2: a mutation score of at least 85% for the verification
# code, checked weekly and on release branches. Stryker changes the code in
# small ways and runs the tests that cover each change; it is too slow for
# every push.

on:
  schedule:
    - cron: "43 3 * * 1"
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    # One job for each package. A mutant in code that every record passes
    # through is covered by nearly every test, and since the tests of every
    # package are counted (scripts/lib/source-aliases.ts) one package takes
    # hours on its own.
    name: Mutation testing of @oip/${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            mutate: "packages/core/src/**/*.ts,!packages/**/*.d.ts"
          - package: schema
            # The validators Ajv generates are tested through the schemas.
            mutate: "packages/schema/src/**/*.ts,!packages/schema/src/generated/**,!packages/**/*.d.ts"
          - package: identity
            mutate: "packages/identity/src/**/*.ts,!packages/**/*.d.ts"
          - package: delegation
            mutate: "packages/delegation/src/**/*.ts,!packages/**/*.d.ts"
          - package: web
            mutate: "packages/web/src/**/*.ts,!packages/**/*.d.ts"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing (fails below a score of 85%)
        run: pnpm mutation --mutate "${{ matrix.mutate }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.package }}
          path: reports/mutation
          retention-days: 30

version = 1

# Licensing, file by file (https://reuse.software). Code is Apache-2.0 and
# documents are CC BY 4.0 (BUILD.md, Section 2). Source files also carry SPDX
# headers; where a file has a header, the header wins. Later entries here
# take precedence over earlier ones.

# Default: code and configuration.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ekram Alam and the Open Intelligence Protocol contributors"
SPDX-License-Identifier = "Apache-2.0"

# Documents: the papers, the specifications, the research and the reviews, the
# test vectors (data that belongs to the specifications), and the project's
# own documentation.
[[annotations]]
path = [
  "*.md",
  "CITATION.cff",
  "docs/**",
  "oeps/**",
  "papers/**",
  "research/**",
  "reviews/**",
  "site/**",
  "spec/**",
  "packages/*/README.md",
  "packages/*/etc/*.api.md",
  "scripts/fixtures/**/README.md",
  ".changeset/*.md",
  ".github/*.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ekram Alam and the Open Intelligence Protocol contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Code that lives among the documents.
[[annotations]]
path = [
  "spec/test-vectors/oip_vectors.py",
  "papers/build/build.py",
  "papers/build/package.json",
  "papers/build/paper.css",
  "reviews/**/*.py",
  "docs/conformance/plan.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ekram Alam and the Open Intelligence Protocol contributors"
SPDX-License-Identifier = "Apache-2.0"

# The JSON Schemas are generated from Apache-2.0 code and live in spec/, so
# either licence may be used: implementers can embed them under the one that
# suits their project.
[[annotations]]
path = "spec/schemas/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Ekram Alam and the Open Intelligence Protocol contributors"
SPDX-License-Identifier = "Apache-2.0 OR CC-BY-4.0"

# The Code of Conduct adapts the Contributor Covenant, which is CC BY 4.0.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Contributor Covenant authors",
  "2026 Ekram Alam and the Open Intelligence Protocol contributors",
]
SPDX-License-Identifier = "CC-BY-4.0"

# Generated by machines from facts: lockfiles and timestamp proofs. No
# authorship is claimed in them.
[[annotations]]
path = ["pnpm-lock.yaml", "papers/build/package-lock.json", "timestamps/**"]
precedence = "closest"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# The A2A project's JSON Schema, which the tests of the A2A gateway validate
# against. It is the A2A project's file, unchanged: see the README beside it.
[[annotations]]
path = "packages/bridge-a2a/test/a2a/a2a.schema.json"
precedence = "override"
SPDX-FileCopyrightText = "The A2A project authors (https://github.com/a2aproject/A2A)"
SPDX-License-Identifier = "Apache-2.0"
